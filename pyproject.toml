[project]
name = "boring"
version = "0.1.0"
description = "Boring — assistant de paiement intelligent du stationnement urbain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4.61",
    "opencv-python>=5.0.0.93",
    "shapely>=2.0",
    "typer>=0.26.7",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pydantic>=2.9",
    "anthropic>=0.40",
]

[project.scripts]
boring = "boring.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boring"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "mitmproxy>=12.2.3",
    "ipython>=8.0",
    "ruff>=0.15.16",
    "pytest>=8.0",
    "ddgs>=9.14.4",
    "imagehash>=4.3.2",
    "Pillow>=12.2.0",
]
