[project]
name = "boring"
version = "0.1.0"
description = "Boring — assistant de paiement intelligent du stationnement urbain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4.147",
    "opencv-python>=4.13.0.92",
    "shapely>=2.0",
    "typer>=0.26.8",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "pydantic>=2.9",
    "anthropic>=0.40",
]

[project.scripts]
boring = "boring.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boring"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",    # function-call-in-default-argument (requires refactoring mutable defaults)
    "BLE001",  # blind-except (requires specific exception handling)
    "DTZ001",  # datetime-without-tzinfo (requires timezone refactoring)
    "DTZ005",  # datetime-now-without-tzinfo (requires timezone refactoring)
    "DTZ901",  # datetime-min-max (requires timezone refactoring)
    "S110",    # try-except-pass (requires explicit suppression)
    "SIM102",  # collapsible-if (style preference)
]

[dependency-groups]
dev = [
    "mitmproxy>=12.2.3",
    "ipython>=9.17.1",
    "ruff>=0.16.10",
    "pytest>=8.0",
    "ddgs>=9.16.0",
    "imagehash>=4.3.2",
    "Pillow>=12.3.0",
]
