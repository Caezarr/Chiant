# Pre-commit hooks : empêche les commits cassés.
# Install : uv run pre-commit install
# Run manuel : uv run pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast)
        entry: uv run pytest tests/ -q --no-header
        language: system
        pass_filenames: false
        # Pas de stage pre-push pour éviter de bloquer un wip — uniquement en commit local
        stages: [pre-commit]
